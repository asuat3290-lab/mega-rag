paths:
  ocr_texts: "D:/path/to/MEGA 2/ocr_output"
  metadata_db: "D:/mega_rag/metadata.db"
  vector_db: "D:/mega_rag/vectors.lancedb"
  cache_db: "D:/mega_rag/cache.db"
  research_exports: "D:/mega_rag/research_exports"
  research_library_db: "D:/mega_rag/research_library.db"
  research_library_exports: "D:/mega_rag/research_library_exports"

ollama:
  base_url: "http://localhost:11434"
  embedding_model: "bge-m3"
  embedding_dim: 1024

retrieval:
  top_k_bm25: 30
  top_k_embedding: 30
  final_top_k: 20
  mmr_lambda: 0.7
  rrf_k: 60

chunking:
  strategy: "by_page"
  max_chunk_chars: 3000

models:
  flash:
    provider: "openai"
    model: "deepseek-chat"
    base_url: "https://api.deepseek.com/v1"
    api_key_env: "DEEPSEEK_API_KEY"
  pro:
    provider: "openai"
    model: "deepseek-reasoner"
    base_url: "https://api.deepseek.com/v1"
    api_key_env: "DEEPSEEK_API_KEY"

cache:
  ttl_hours: 48
  max_entries: 10000